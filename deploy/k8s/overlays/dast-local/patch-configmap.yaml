apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-config
# No data overrides — the scan inherits the production-default RENDER_MAX_TIER
# (playwright) so the browser render tiers are exercised. Previously this patch
# pinned RENDER_MAX_TIER: "http" which gave a clean bill of health to the browser
# tiers while generating false-positive findings on the HTTP tier. Removed in
# Phase 6 (DAST remediation). The file is kept so the kustomization patch target
# remains valid; a metadata-only patch is a no-op for the data section.
