apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mcp-system

resources:
  - ../../base
  - ingress.yaml

# Shared store — required for multi-replica rate limiting and the crawl queue.
# To use an external Redis/Valkey instead, remove this line and patch
# STORE_BACKEND + STORE_REDIS_URL in the configmap patch below.
components:
  - ../../components/valkey

# Replace with your registry and release tag before deploying.
images:
  - name: markdown-for-agents-mcp:latest
    newName: <your-registry>/markdown-for-agents-mcp
    newTag: <release-tag>

patches:
  - path: server-patch.yaml
    target:
      kind: Deployment
      name: mcp-server
  - path: worker-patch.yaml
    target:
      kind: Deployment
      name: mcp-worker
