apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  labels:
    app: mcp-server
spec:
  selector:
    app: mcp-server
  ports:
    - name: http
      port: 80
      targetPort: 3000
  type: ClusterIP
---
# PodDisruptionBudget — keep at least 2 replicas during rolling updates
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mcp-server-pdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: mcp-server
