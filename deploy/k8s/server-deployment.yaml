apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  labels:
    app: mcp-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      # Reap Chrome child processes; keeps PID table clean.
      # Equivalent to dumb-init in the container but avoids baking a binary.
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 90   # must exceed SHUTDOWN_DRAIN_MS + SHUTDOWN_TIMEOUT_MS (35s)
      containers:
        - name: mcp-server
          image: markdown-for-agents-mcp:latest
          command: ["node", "dist/index.js", "--http", "3000"]
          ports:
            - containerPort: 3000
          env:
            - name: MCP_ROLE
              value: server
            - name: MCP_HTTP_MODE
              value: stateless
            - name: LOG_FORMAT
              value: json
            - name: RENDER_MAX_CONCURRENCY
              value: "8"
            - name: SHUTDOWN_DRAIN_MS
              value: "5000"
            - name: SHUTDOWN_TIMEOUT_MS
              value: "30000"
            - name: STORE_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: mcp-config
                  key: STORE_BACKEND
                  optional: true
            - name: STORE_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: mcp-secrets
                  key: STORE_REDIS_URL
                  optional: true
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-secrets
                  key: MCP_AUTH_TOKEN
                  optional: true
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            # 1 GB tmpfs at /dev/shm; Chrome renderers exhaust the default 64 MB under concurrency.
            - name: dshm
              mountPath: /dev/shm
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            # Process-level only — never depend on Redis/stores or a Redis blip restarts the fleet.
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /readyz
              port: 3000
            failureThreshold: 30     # allows up to 5 min for browser warmup + model load
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "5"]   # give Endpoints controller time to remove pod
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: mcp-server
