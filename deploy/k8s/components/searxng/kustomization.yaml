apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - searxng.yaml

# Patch the shared ConfigMap to point the server at the in-cluster SearXNG.
# Remove this component to disable SearXNG and rely on DuckDuckGo tier-3 only.
patches:
  - target:
      kind: ConfigMap
      name: mcp-config
    patch: |-
      - op: add
        path: /data/SEARXNG_URL
        value: http://searxng:8080
