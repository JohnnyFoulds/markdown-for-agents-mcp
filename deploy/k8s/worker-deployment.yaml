apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-worker
  labels:
    app: mcp-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mcp-worker
  template:
    metadata:
      labels:
        app: mcp-worker
    spec:
      terminationGracePeriodSeconds: 90
      containers:
        - name: mcp-worker
          image: markdown-for-agents-mcp:latest
          command: ["node", "dist/index.js", "--role=worker"]
          env:
            - name: MCP_ROLE
              value: worker
            - name: LOG_FORMAT
              value: json
            - name: RENDER_MAX_CONCURRENCY
              value: "16"
            - name: CRAWL_MAX_CONCURRENCY
              value: "10"
            - name: SHUTDOWN_DRAIN_MS
              value: "5000"
            - name: SHUTDOWN_TIMEOUT_MS
              value: "30000"
            - name: STORE_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: mcp-config
                  key: STORE_BACKEND
                  optional: true
            - name: STORE_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: mcp-secrets
                  key: STORE_REDIS_URL
                  optional: true
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
          livenessProbe:
            exec:
              command: ["node", "-e", "process.exit(0)"]
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
