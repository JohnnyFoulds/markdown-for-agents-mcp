apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-config
data:
  # Default store: SQLite (no external dependency, single-replica only).
  # For multi-replica deployments include the valkey component:
  #   components/valkey — adds Valkey deployment and switches STORE_BACKEND=redis
  # For an external Redis/Valkey instance, set STORE_BACKEND and STORE_REDIS_URL
  # in your overlay's configmap patch.
  STORE_BACKEND: "sqlite"
  # STORE_SQLITE_PATH must be absolute and writable by UID 1000 (pwuser).
  # The default 'crawl.db' is relative to WORKDIR /app, which is root-owned
  # and causes CrashLoopBackOff before the startup probe passes.
  # /tmp is writable by all users; the emptyDir volume in server.yaml and
  # worker.yaml ensures it is always present and bounded.
  STORE_SQLITE_PATH: "/tmp/crawl.db"

  # Search locale defaults — tune for your user population
  SEARCH_DEFAULT_COUNTRY: "za"
  SEARCH_DEFAULT_LANGUAGE: "en"
  LOG_REDACT_QUERIES: "true"
  SEARXNG_ENGINE_PROFILE: "clean"
  SEARCH_CACHE_TTL_MS: "3600000"

  MCP_HTTP_MODE: "stateless"
  LOG_FORMAT: "json"
  LOG_LEVEL: "INFO"
  LIGHTPANDA_ENABLED: "false"

  RATE_LIMIT_PER_HOST_RPS: "2"
  RATE_LIMIT_BURST: "5"
  SHUTDOWN_DRAIN_MS: "5000"
  SHUTDOWN_TIMEOUT_MS: "30000"

  # POPIA s14 retention (unconditional — not under POPIA_MODE)
  CRAWL_RETENTION_MS: "604800000"        # 7 days
  RETENTION_SWEEP_INTERVAL_MS: "3600000" # 1 hour

  # POPIA Phase 3 — egress surface controls
  # DuckDuckGo is US-hosted with no data-processing agreement; set false to remove from fanout
  SEARCH_ENABLE_DUCKDUCKGO: "true"
  # enforce = block on detection; monitor = audit-only; off = all controls disabled (loud warning)
  POPIA_MODE: "enforce"
  # Restrict download_file outputPath to these prefixes (POPIA s19 disk surface)
  DOWNLOAD_DIR_ALLOWLIST: "/tmp"

  # Prometheus scraping is handled by existing cluster Prometheus via pod
  # annotations on the server pods (prometheus.io/scrape=true on port 3000).
  # No Prometheus or Grafana is deployed by these manifests.
  # For an external Prometheus, add a scrape job pointing to the mcp-server
  # Service on port 3000, path /metrics.
