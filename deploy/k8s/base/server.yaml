apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  labels:
    app: mcp-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 90
      containers:
        - name: mcp-server
          image: markdown-for-agents-mcp:latest
          command: ["node", "dist/index.js", "--http", "3000"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            # /tmp and /dev/shm are emptyDir mounts, so the root fs has no
            # legitimate write target. Eliminates /home/pwuser as a writable path.
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: mcp-config
          env:
            - name: MCP_ROLE
              value: server
            - name: RENDER_MAX_CONCURRENCY
              value: "8"
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-secrets
                  key: MCP_AUTH_TOKEN
                  optional: true
            - name: BRAVE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mcp-secrets
                  key: BRAVE_API_KEY
                  optional: true
            - name: SERPER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mcp-secrets
                  key: SERPER_API_KEY
                  optional: true
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            # 1 GiB tmpfs — Chrome exhausts the default 64 MiB /dev/shm under concurrency
            - name: dshm
              mountPath: /dev/shm
            # /tmp — SQLite db (STORE_SQLITE_PATH=/tmp/crawl.db) and Chromium
            # temp files; bounded emptyDir prevents charges to node ephemeral
            # storage and keeps writes within the pod lifecycle.
            - name: tmp
              mountPath: /tmp
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          startupProbe:
            httpGet:
              path: /readyz
              port: 3000
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            # /healthz is process-only — never depend on Redis or a Redis blip restarts the fleet
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: mcp-server
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  labels:
    app: mcp-server
spec:
  selector:
    app: mcp-server
  ports:
    - name: http
      port: 80
      targetPort: 3000
  type: ClusterIP
