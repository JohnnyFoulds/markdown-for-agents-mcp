apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-worker
  labels:
    app: mcp-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mcp-worker
  template:
    metadata:
      labels:
        app: mcp-worker
    spec:
      terminationGracePeriodSeconds: 90
      containers:
        - name: mcp-worker
          image: markdown-for-agents-mcp:latest
          command: ["node", "dist/index.js", "--role=worker"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            # /tmp and /dev/shm are emptyDir mounts, so the root fs has no
            # legitimate write target. Eliminates /home/pwuser as a writable path.
            readOnlyRootFilesystem: true
          envFrom:
            - configMapRef:
                name: mcp-config
          env:
            - name: MCP_ROLE
              value: worker
            - name: RENDER_MAX_CONCURRENCY
              value: "16"
            - name: CRAWL_MAX_CONCURRENCY
              value: "10"
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            # /tmp — SQLite db (STORE_SQLITE_PATH=/tmp/crawl.db) and Chromium temp files
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            exec:
              command: ["node", "-e", "process.exit(0)"]
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
