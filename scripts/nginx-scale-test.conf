upstream mcp {
    server mcp-server:3000;  # Docker internal DNS resolves all scale replicas
}

server {
    listen 80;

    location / {
        proxy_pass         http://mcp;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Replica-Id      $upstream_addr;
        proxy_read_timeout 120s;
    }
}
