# Services from the same image:
#   mcp-server  — serves MCP over HTTP in stateless mode
#   mcp-worker  — runs the crawl worker loop, no HTTP listener
#
# Optional sidecars (disabled by default — activate with --profile):
#   lightpanda  — Tier 2 render sidecar (AGPL-3.0, CDP)
#                 docker compose --profile lightpanda up
#                 Set LIGHTPANDA_ENABLED=true in your .env to enable the tier.
#   searxng     — Zero-budget Tier-2 search provider (clean engine profile by default)
#                 docker compose --profile searxng up
#                 Set SEARXNG_URL=http://searxng:8080 and optionally SEARXNG_ENGINE_PROFILE=full.
#   redis       — Shared store for multi-replica deployments
#                 docker compose --profile redis up
#                 Set STORE_BACKEND=redis and STORE_REDIS_URL=redis://redis:6379.
#
# Minimal single-replica start (no sidecars):
#   docker compose up
#   → HTTP + Playwright render, SQLite store

services:
  mcp-server:
    build: .
    image: markdown-for-agents-mcp:local
    command: ["node", "dist/index.js", "--http", "3000"]
    ports:
      - "3000:3000"
    environment:
      MCP_ROLE: server
      MCP_HTTP_MODE: stateless
      STORE_BACKEND: "${STORE_BACKEND:-sqlite}"
      STORE_REDIS_URL: "${STORE_REDIS_URL:-}"
      MCP_AUTH_TOKEN: "${MCP_AUTH_TOKEN:-}"
      RATE_LIMIT_PER_HOST_RPS: "${RATE_LIMIT_PER_HOST_RPS:-2}"
      RATE_LIMIT_BURST: "${RATE_LIMIT_BURST:-5}"
      SHUTDOWN_DRAIN_MS: "5000"
      SHUTDOWN_TIMEOUT_MS: "30000"
      LOG_FORMAT: json
      LIGHTPANDA_ENABLED: "${LIGHTPANDA_ENABLED:-false}"
      LIGHTPANDA_CDP_URL: "${LIGHTPANDA_CDP_URL:-ws://lightpanda:9222}"
      SEARXNG_URL: "${SEARXNG_URL:-}"
      SEARXNG_ENGINE_PROFILE: "${SEARXNG_ENGINE_PROFILE:-clean}"
    # Provide 1 GB tmpfs at /dev/shm so Chromium renderers don't exhaust the
    # Docker default 64 MB and crash under concurrency.
    shm_size: 1gb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      lightpanda:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
      searxng:
        condition: service_healthy
        required: false

  mcp-worker:
    image: markdown-for-agents-mcp:local
    command: ["node", "dist/index.js", "--role=worker"]
    environment:
      MCP_ROLE: worker
      STORE_BACKEND: "${STORE_BACKEND:-sqlite}"
      STORE_REDIS_URL: "${STORE_REDIS_URL:-}"
      CRAWL_MAX_CONCURRENCY: "${CRAWL_MAX_CONCURRENCY:-5}"
      CRAWL_QUEUE_LEASE_MS: "30000"
      CRAWL_WORKER_POLL_MS: "1000"
      SHUTDOWN_DRAIN_MS: "5000"
      SHUTDOWN_TIMEOUT_MS: "30000"
      LOG_FORMAT: json
      LIGHTPANDA_ENABLED: "${LIGHTPANDA_ENABLED:-false}"
      LIGHTPANDA_CDP_URL: "${LIGHTPANDA_CDP_URL:-ws://lightpanda:9222}"
      SEARXNG_URL: "${SEARXNG_URL:-}"
      SEARXNG_ENGINE_PROFILE: "${SEARXNG_ENGINE_PROFILE:-clean}"
    shm_size: 1gb
    restart: unless-stopped
    depends_on:
      mcp-server:
        condition: service_healthy
      lightpanda:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
      searxng:
        condition: service_healthy
        required: false

  # Tier 2 render sidecar — Lightpanda speaks CDP (same protocol as Playwright).
  # AGPL-3.0: run as a separate process, never imported/vendored into our code.
  # Activate with: docker compose --profile lightpanda up
  # Also set LIGHTPANDA_ENABLED=true (via .env or -e) to enable the render tier.
  lightpanda:
    image: lightpanda/browser:0.3.7
    restart: unless-stopped
    profiles:
      - lightpanda
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9222' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Optional SearXNG — activate with: docker compose --profile searxng up
  # Also set SEARXNG_URL=http://searxng:8080 (done automatically via the env passthrough above).
  # SEARXNG_ENGINE_PROFILE=clean (default) uses only ToS-safe engines.
  # Set SEARXNG_ENGINE_PROFILE=full only after legal sign-off (adds Google/Bing/DDG).
  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_SETTINGS_PATH: /etc/searxng/settings.yml
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    profiles:
      - searxng

  # Optional Redis — activate with: docker compose --profile redis up
  # Also set STORE_BACKEND=redis and STORE_REDIS_URL=redis://redis:6379.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - redis

volumes:
  redis-data:
