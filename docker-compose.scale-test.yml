# Scale-proof compose — standalone (does not extend docker-compose.yml).
# Run with:
#   docker compose -f docker-compose.scale-test.yml \
#     up -d --scale mcp-server=3 --scale mcp-worker=2
#
# nginx round-robins across all mcp-server replicas on host port 3000.
# Redis is always enabled (no profile gate).

services:
  nginx:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./scripts/nginx-scale-test.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - mcp-server
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  mcp-server:
    image: markdown-for-agents-mcp:local
    command: ["node", "dist/index.js", "--http", "3000"]
    # No host port binding — nginx reaches replicas over the internal network
    expose:
      - "3000"
    environment:
      MCP_ROLE: server
      MCP_HTTP_MODE: stateless
      STORE_BACKEND: redis
      STORE_REDIS_URL: "redis://redis:6379"
      RATE_LIMIT_PER_HOST_RPS: "2"
      RATE_LIMIT_BURST: "2"
      SHUTDOWN_DRAIN_MS: "5000"
      SHUTDOWN_TIMEOUT_MS: "30000"
      LOG_FORMAT: json
      LIGHTPANDA_ENABLED: "true"
      LIGHTPANDA_CDP_URL: "ws://lightpanda:9222"
    shm_size: 1gb
    depends_on:
      redis:
        condition: service_healthy
      lightpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  mcp-worker:
    image: markdown-for-agents-mcp:local
    command: ["node", "dist/index.js", "--role=worker"]
    environment:
      MCP_ROLE: worker
      STORE_BACKEND: redis
      STORE_REDIS_URL: "redis://redis:6379"
      CRAWL_MAX_CONCURRENCY: "5"
      CRAWL_QUEUE_LEASE_MS: "30000"
      CRAWL_WORKER_POLL_MS: "1000"
      SHUTDOWN_DRAIN_MS: "5000"
      SHUTDOWN_TIMEOUT_MS: "30000"
      LOG_FORMAT: json
      LIGHTPANDA_ENABLED: "true"
      LIGHTPANDA_CDP_URL: "ws://lightpanda:9222"
    shm_size: 1gb
    depends_on:
      redis:
        condition: service_healthy
      lightpanda:
        condition: service_healthy

  # Tier 2 render sidecar — AGPL-3.0, run as a separate process via CDP.
  lightpanda:
    image: lightpanda/browser:0.3.7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9222/json"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes: {}
