# ZAP rules configuration — accepted-risk suppressions
#
# Format: <ruleId><TAB><IGNORE|WARN|FAIL>[<TAB><url-regex>]
# IGNORE = suppress entirely; WARN = report but do not fail; FAIL = report and fail
#
# This file is mounted into the ZAP container by scan-dast.mjs and passed via -c.
# Absent entries default to WARN (report, do not fail scan).
#
# How to add a suppression:
#   1. Run a DAST scan and note the alert ruleId from dast-zap.json
#   2. Confirm the finding is a known false positive or accepted risk
#   3. Add an IGNORE entry here with a comment explaining the decision
#   4. Commit so the decision is version-controlled

# ── Accepted risks ────────────────────────────────────────────────────────────

# 10021  X-Content-Type-Options — FIXED in Phase 2.3 via applyBaseHeaders().
#        No suppression needed; leaving comment for traceability.

# 10049  Cache-Control: no-store — FIXED in Phase 2.3 via applyBaseHeaders().
#        No suppression needed; leaving comment for traceability.

# 10055  CSP (Content-Security-Policy) — INTENTIONAL omission.
#        This server returns only JSON and Prometheus text, never HTML.
#        CSP is inert for non-HTML content and adds maintenance overhead.
10055	IGNORE

# 10035  Strict-Transport-Security — INTENTIONAL omission.
#        HSTS belongs at the TLS terminator (ingress/load-balancer), not on the
#        plaintext HTTP listener behind it. Setting it here would cause browsers
#        to cache it incorrectly if the server is ever exposed directly.
10035	IGNORE

# 10098  Cross-Domain Misconfiguration — CORS.
#        The MCP endpoint does not set Access-Control-Allow-Origin. ZAP may flag
#        the absence of CORS headers as a misconfiguration on JSON APIs.
#        Correct for MCP: this endpoint is not a browser-facing AJAX API.
10098	IGNORE
