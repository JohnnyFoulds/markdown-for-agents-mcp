rules:
  # ── 1. No direct process.env access outside src/config.ts ─────────────────
  # Grounding: this exact pattern caused the HTTP auth fail-open bug at
  # index.ts:81 — process.env['MCP_AUTH_TOKEN'] was read directly, bypassing
  # the Zod schema and silently ignoring unset / misspelled env vars.
  # Phase 2.1 moved all env reads into src/config.ts. This rule prevents
  # regression by flagging any new direct env reads outside that file.
  - id: no-process-env-outside-config
    message: >
      Direct process.env access bypasses the Zod validation schema in src/config.ts.
      An unset or misspelled variable silently becomes undefined instead of throwing.
      Read configuration from the config object returned by getConfig() instead.
      Grounding: this pattern caused the auth fail-open bug (Phase 2.1, index.ts:81).
    severity: WARNING
    languages: [typescript, javascript]
    pattern-either:
      - pattern: process.env.$VAR
      - pattern: process.env[$VAR]
    paths:
      exclude:
        - "**/src/config.ts"
        - "**/*.test.ts"
        - "**/*.test.js"
        - "scripts/"
        - "*.config.ts"
        - "*.config.js"
        - "vitest.config.ts"

  # ── 2. Shell injection via template literal or variable ────────────────────
  # execSync()/exec() with a non-literal argument is a shell injection risk if
  # the argument contains any caller-supplied value. Static string literals
  # are acceptable (e.g. execSync('npx playwright install chromium')).
  # Use spawn(cmd, argsArray, {shell: false}) for parameterised commands.
  - id: shell-injection-interpolation
    message: >
      execSync() called with a non-literal argument. If the argument contains any
      caller-supplied value, this is exploitable shell injection. Use spawn(cmd,
      argsArray, {shell: false}) to avoid shell metacharacter interpretation.
      Static string literals are acceptable (e.g. execSync("npx ...")).
    severity: ERROR
    languages: [typescript, javascript]
    patterns:
      - pattern: execSync($CMD, ...)
      - pattern-not: execSync("...", ...)

  # ── 3. No direct fetch() in tool/service code — SSRF guard bypass ─────────
  # All outbound HTTP requests must flow through src/http/client.ts, which
  # enforces: SSRF guard (validateUrl), DNS guard (dnsGuardLookup), rate
  # limiting, and redirect safety. A direct fetch() call in tool or service
  # code bypasses every one of these controls.
  - id: no-direct-fetch-bypass-guard
    message: >
      Direct fetch() call in src/tools/ or src/services/ bypasses the SSRF guard,
      DNS guard, and rate limiter in src/http/client.ts. Use the HttpClient (or one
      of the approved service wrappers) so every outbound request is validated
      against the domain blocklist and rate-limited.
    severity: WARNING
    languages: [typescript]
    pattern: fetch($URL, ...)
    paths:
      include:
        - "**/src/tools/"
        - "**/src/services/"

  # ── 4. Sensitive variable names logged directly ────────────────────────────
  # Variables named query, token, key, or secret must go through redactQuery()
  # (src/utils/logger.ts) before logging. POPIA: query text may contain personal
  # information; tokens and keys are credentials.
  # This rule catches the direct-log case: console.log(query).
  - id: sensitive-var-in-console-log
    message: >
      Variable named query/token/key/secret logged directly to console. This may
      expose personal information (POPIA) or credentials. Call redactQuery(value)
      from src/utils/logger.ts first, or route through a Logger call that respects
      LOG_REDACT_QUERIES.
    severity: WARNING
    languages: [typescript, javascript]
    patterns:
      - pattern: console.log($ARG)
      - metavariable-regex:
          metavariable: $ARG
          regex: "^(query|token|key|secret|password|apiKey|api_key)$"

  # ── 5. Security headers must not be set via res.writeHead() ───────────────
  # Cache-Control and X-Content-Type-Options must be set via applyBaseHeaders()
  # using res.setHeader(). Setting them inside res.writeHead(status, headers)
  # OVERRIDES the applyBaseHeaders() call rather than composing with it, because
  # writeHead() merges its headers object over all previously-set headers.
  # Phase 2.3 established this pattern; this rule guards against regression.
  #
  # Note: patterns containing object literals with colons must use YAML block
  # scalars (|) to avoid YAML mapping value ambiguity.
  - id: no-security-headers-in-writehead
    message: >
      Cache-Control or X-Content-Type-Options in res.writeHead() headers object
      overrides applyBaseHeaders() rather than composing with it. Use
      applyBaseHeaders(res) via res.setHeader() before the response instead.
      Phase 2.3 established this pattern; do not bypass it.
    severity: WARNING
    languages: [typescript]
    pattern-either:
      - pattern: |
          $RES.writeHead($S, {'Cache-Control': $V, ...})
      - pattern: |
          $RES.writeHead($S, {"Cache-Control": $V, ...})
      - pattern: |
          $RES.writeHead($S, {'X-Content-Type-Options': $V, ...})
      - pattern: |
          $RES.writeHead($S, {"X-Content-Type-Options": $V, ...})
